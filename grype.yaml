# Optional safeguard when scanning Chainguard remediated libraries. Disabling CPE
# (fuzzy) matching stops grype from re-reporting, via a loose version match, a CVE
# that Chainguard already fixed in a "+cgr.N" / "-0.cgr.N" build.
# NOTE: with the current grype + DB this is effectively a NO-OP — the remediated
# builds are recognized as fixed with or without this file — but it's kept as
# belt-and-suspenders (per Chainguard's scanner guidance) in case a future DB
# regresses. Ref: https://edu.chainguard.dev/chainguard/libraries/scanners/
match:
  python:
    using-cpes: false
  java:
    using-cpes: false
