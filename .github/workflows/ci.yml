# Demo CI for the workshop's Guardener "Hardened Actions" use case.
# It is pinned to MUTABLE upstream tags (@v4, @v5, ...) ON PURPOSE — that's the BEFORE.
# Run `chainctl guardener github migrate create` (or let the Guardener App open its
# scheduled PR) and watch every `uses:` become a SHA-pinned chainguard-actions/* equivalent.
#
# Trigger is workflow_dispatch only, so adding/updating this file never spawns a (red)
# CI run — the point is the `uses:` lines Guardener hardens, not the build itself.
name: CI (Guardener demo)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: chainguard-actions/actions-checkout@59b7218bfc2eaabc464f1254f6e1dac5bda91d94 # v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install & smoke-test
        run: |
          pip install -r python/app/requirements.txt
          python -c "import werkzeug; print(werkzeug.__version__)"

      - uses: chainguard-actions/docker-setup-buildx-action@6d415f71ab3ef9a7738ade671313ffac4ba9f06c # v3

      - uses: chainguard-actions/docker-build-push-action@90e59df237ac4b0e77911df31d377167fc308506 # v6
        with:
          context: python
          file: python/Dockerfile.2-image
          push: false
          tags: py:ci
