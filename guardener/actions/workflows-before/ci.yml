# The "BEFORE" — a typical CI workflow pinned to MUTABLE TAGS (@v4, @v5, ...).
# A moved tag (tag hijacking) silently reruns whatever the upstream maintainer — or an
# attacker who compromised them — points it at. This is what Guardener's Hardened Actions
# rewrites: same inputs/outputs, but SHA-pinned Chainguard-hardened equivalents.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install & test
        run: |
          pip install -r python/app/requirements.txt
          python -c "import werkzeug; print(werkzeug.__version__)"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/build-push-action@v6
        with:
          context: python
          file: python/Dockerfile.2-image
          push: false
          tags: py:ci
